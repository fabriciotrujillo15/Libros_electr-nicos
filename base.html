<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de codificación de caracteres para soportar tildes y eñes -->
    <meta charset="UTF-8">
    <!-- Hace que la página sea responsiva y se adapte a celulares, tablets y computadoras -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital UIDE</title>
    
    <!-- Importación de fuente tipográfica moderna (Inter) desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Framework Bootstrap 5.3 CSS para estilos y componentes responsivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Librería FontAwesome para iconos universitarios profesionales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos CSS personalizados para la interfaz -->
    <style>
        body {
            font-family: 'Inter', sans-serif; /* Aplica la fuente Inter a todo el documento */
            background-color: #f4f6f9;         /* Color de fondo gris claro institucional */
            color: #334155;                    /* Color de texto principal oscuro para legibilidad */
        }
        .navbar-custom {
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); /* Degradado oscuro elegante para el menú */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);                  /* Sombra sutil debajo de la barra */
            border-bottom: 3px solid #3a86ff;                             /* Borde inferior azul destacado */
        }
        .card-custom {
            border: none;
            border-radius: 16px;                     /* Bordes redondeados modernos para las tarjetas */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); /* Sombra difuminada para efecto flotante */
            background: #ffffff;
            transition: all 0.3s ease;
        }
        .form-control {
            border-radius: 10px;     /* Inputs con esquinas redondeadas */
            padding: 12px 16px;      /* Espacio interior cómodo para escribir */
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #3a86ff;   /* Borde azul brillante al hacer clic en el input */
            box-shadow: 0 0 0 4px rgba(58, 134, 255, 0.12); /* Efecto de brillo exterior */
        }
        .btn-custom-primary {
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #3a86ff 0%, #2563eb 100%); /* Botón con degradado azul */
            border: none;
            color: white;
            box-shadow: 0 4px 12px rgba(58, 134, 255, 0.3);
            transition: transform 0.2s;
        }
        .btn-custom-primary:hover {
            transform: translateY(-1px); /* Pequeño efecto de elevación al pasar el mouse */
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación Institucional fija en la parte superior -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5 py-3">
        <div class="container px-4">
            
            <!-- Logotipo y Nombre del Sistema con enlace a la página principal -->
            <a class="navbar-brand d-flex align-items-center gap-3 text-white text-decoration-none" href="/">
                <div class="bg-white text-primary p-2 rounded-3 d-flex align-items-center justify-content-center shadow" style="width: 42px; height: 42px;">
                    <i class="fa-solid fa-graduation-cap fa-lg"></i>
                </div>
                <div class="d-flex flex-column">
                    <span class="fw-bold fs-5 lh-1 text-white">Biblioteca</span>
                    <span class="text-info fw-bold fs-6 tracking-wide">UIDE ACADEMIC</span>
                </div>
            </a>
            
            <!-- Opciones del menú de navegación -->
            <div class="collapse navbar-collapse show">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4">
                    
                    <!-- Opción 1: Enlace dinámico a Agregar Libro -->
                    <li class="nav-item">
                        <a class="nav-link px-3 {{if eq .Pagina "inicio"}}active text-info fw-bold border-bottom border-info border-2{{else}}text-light{{end}}" href="/">
                            <i class="fa-solid fa-circle-plus me-1"></i> Agregar Libro
                        </a>
                    </li>
                    
                    <!-- Opción 2: Enlace dinámico a Gestión de Libros -->
                    <li class="nav-item">
                        <a class="nav-link px-3 {{if eq .Pagina "libros"}}active text-info fw-bold border-bottom border-info border-2{{else}}text-light{{end}}" href="/libros">
                            <i class="fa-solid fa-books me-1"></i> Gestión de Libros
                        </a>
                    </li>
                </ul>

                <!-- Botón externo para acceder directamente a la API JSON -->
                <div>
                    <a href="/api/libros" target="_blank" class="btn btn-outline-info btn-sm px-3 py-2 fw-semibold rounded-pill">
                        <i class="fa-solid fa-code me-1"></i> API JSON
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal: Plantilla dinámica donde se inyectan las vistas hijas (como libros.html o la vista de agregar) -->
    <main class="container mb-5">
        {{template "content" .}}
    </main>

    <!-- Script de Bootstrap 5.3 JS para elementos interactivos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
