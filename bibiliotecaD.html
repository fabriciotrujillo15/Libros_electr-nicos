<!-- Define una plantilla reutilizable llamada "content" que se inyectará dentro de base.html -->
{{define "content"}}
<div class="row justify-content-center">
    <div class="col-lg-10">
        
        <!-- Encabezado de la sección con título y descripción -->
        <div class="mb-4">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-book-medical text-primary me-2"></i>Registro de Libros Electrónicos</h2>
            <p class="text-muted">Utiliza el siguiente formulario para dar de alta un nuevo libro en la biblioteca académica.</p>
        </div>

        <!-- Tarjeta contenedora con diseño personalizado y espacio interior -->
        <div class="card card-custom p-4">
            
            <!-- Formulario HTML que envía los datos mediante el método POST a la ruta del backend "/libros/crear" -->
            <form action="/libros/crear" method="POST" class="row g-3">
                
                <!-- Columna para el campo de entrada del Título  -->
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-secondary">Título</label>
                    <input type="text" class="form-control" name="titulo" placeholder="Ej. Cien años de soledad" required>
                </div>
                
                <!-- Columna para el campo de entrada del Autor  -->
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-secondary">Autor</label>
                    <input type="text" class="form-control" name="autor" placeholder="Ej. Gabriel García Márquez" required>
                </div>
                
                <!-- Columna para el campo de entrada de la Serie  -->
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-secondary">Serie</label>
                    <input type="text" class="form-control" name="serie_libro" placeholder="Ej. Vol. 1">
                </div>
                
                <!-- Columna para el campo de entrada del Formato  -->
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-secondary">Formato</label>
                    <input type="text" class="form-control" name="formato" placeholder="Ej. PDF">
                </div>
                
                <!-- Columna para el botón de envío , alineado en la parte inferior para coincidir con los inputs -->
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-custom-primary w-100">+ Nuevo</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}
